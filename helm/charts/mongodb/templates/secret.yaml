{{- if and .Values.auth.enabled (eq (include "mongodb.createSecret" .) "true") }}
{{- if not (and .Values.auth.rootPassword .Values.auth.password) }}
{{- fail "mongodb: auth.enabled but no passwords: set auth.existingSecret, externalSecrets.enabled=true, or auth.rootPassword/password (local clusters only)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mongodb.secretName" . }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKeys.rootPassword }}: {{ .Values.auth.rootPassword | quote }}
  {{ .Values.auth.secretKeys.password }}: {{ .Values.auth.password | quote }}
{{- end }}
