{{- if and .Values.alloy.enabled .Values.externalSecrets.enabled (not .Values.alloy.loki.existingSecret) }}
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "app.alloy.secretName" . }}
  labels:
    {{- include "app.labels" (dict "ctx" . "component" "alloy") | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ include "app.secretStoreName" . }}
    kind: SecretStore
  target:
    name: {{ include "app.alloy.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.alloy.loki.secretKey }}
      remoteRef:
        key: {{ required "alloy.loki.remoteKey is required when externalSecrets is enabled" .Values.alloy.loki.remoteKey }}
{{- end }}
