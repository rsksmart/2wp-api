{{- if and .Values.alloy.enabled .Values.alloy.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "app.alloy.serviceAccountName" . }}
  labels:
    {{- include "app.labels" (dict "ctx" . "component" "alloy") | nindent 4 }}
  {{- with .Values.alloy.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.alloy.enabled .Values.alloy.rbac.create }}
---
# Cluster-scoped: a namespaced Role would see only this namespace's logs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "app.alloy.fullname" . }}
  labels:
    {{- include "app.labels" (dict "ctx" . "component" "alloy") | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "app.alloy.fullname" . }}
  labels:
    {{- include "app.labels" (dict "ctx" . "component" "alloy") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "app.alloy.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "app.alloy.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
