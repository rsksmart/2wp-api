# staging-mainnet: cluster atlas-staging-mainnet, namespace 2wp-api.
# env mirrors ansible/group_vars/twowp_app_api_staging_mainnet; ARNs from `tofu output`.
# NODE_ENV and BTC_CONFIRMATIONS already match the chart defaults.

envSuffix: staging-mainnet
clusterName: atlas-staging-mainnet

image:
  # Set per deploy by the workflow; empty means appVersion
  tag: ""
  pullPolicy: IfNotPresent

env:
  NETWORK: mainnet

  RSK_NODE_HOST: http://node-01.staging-mainnet.2wp.iovlabs.net:4444
  BLOCKBOOK_URL: https://blockbook.mainnet.2wp.iovlabs.net:9130
  FEDERATION_ADDRESSES_HISTORY: "35iEoWHfDfEXRQ5ZWM5F6eMsY2Uxrc64YK 3DsneJha6CY6X9gU2M9uEc4nSdbYECB4Gh 39qrdxFmkP3bC7Qe74wE4VXemQzXzNHr1h 32Bhwee9FzQbuaG29RcXpdrvYnvZeMk11M 3GQ87zLKyTygsRMZ1hfCHZSdBxujzKoCCU"

  SYNC_INTERVAL_TIME: "2000"
  SYNC_INITIAL_BLOCK_HEIGHT: "5468000"
  SYNC_INITIAL_BLOCK_HASH: "0x2b7bd279327415c8183e37d9ee484599f6ada55a95682d99dcbf06299fe203fa"
  SYNC_INITIAL_BLOCK_PREV_HASH: "0x35b21215262cf69d96917e6c4a4da380586ad75ddd67b3efb28c784415ea503f"

  MAX_AMOUNT_ALLOWED_IN_SATOSHI: "10000000000000000000"
  ADDRESS_LIST_MAX_ITEMS: "120"

  DEPLOY_ENV: staging-mainnet
  # Staging-mainnet talks to the dev backoffice, same as staging-testnet
  BACKOFFICE_API_URL: https://bob.dev.atlas.rootstock.io
  BACKOFFICE_API_EMAIL: 2wp-api-client@rootstocklabs.com
  BACKOFFICE_FLAGS_CACHE_TTL_MS: "300000"

# One m7g.medium node, so one replica and no PDB: minAvailable blocks drains.
api:
  enabled: true
  replicaCount: 1
  podDisruptionBudget:
    enabled: false
  targetGroupBinding:
    enabled: true
    targetGroupArn: arn:aws:elasticloadbalancing:us-east-1:828880111490:targetgroup/atlas-staging-mainnet-api-sm/695cef509b1695ff

daemon:
  enabled: true

externalSecrets:
  enabled: true
  apiSecrets:
    - secretKey: RSK_DB_CONNECTION_PASSWORD
      remoteKey: /atlas-staging-mainnet/2wp-api/rsk-db-connection-password
    - secretKey: BACKOFFICE_API_PASSWORD
      remoteKey: /atlas-staging-mainnet/2wp-api/backoffice-api-password

# Read at grafana.iovproject.com. Uses the 2wp-api-prod tenant creds, not 2wp-api-staging.
alloy:
  enabled: true
  loki:
    remoteKey: /atlas-staging-mainnet/2wp-api/loki-ingest-url

mongodb:
  persistence:
    # 50Gi matches the EBS volume the EC2 env gives MongoDB
    size: 50Gi
    createStorageClass: true
    # StorageClass parameters are immutable once created
    storageClassParameters:
      type: gp3
      encrypted: "true"
      kmsKeyId: arn:aws:kms:us-east-1:828880111490:key/1d768121-56ce-4a93-b702-14a309934638
  # Trimmed from subchart defaults so everything fits one node
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  externalSecrets:
    enabled: true
    secrets:
      - secretKey: MONGO_INITDB_ROOT_PASSWORD
        remoteKey: /atlas-staging-mainnet/2wp-api/mongodb-root-password
      - secretKey: MONGO_APP_PASSWORD
        remoteKey: /atlas-staging-mainnet/2wp-api/rsk-db-connection-password
