name: Deploy chart to Kubernetes

# Installs the chart into one cluster, called by whichever workflow is rolling it. Only the environment and values file differ. Not callable on its own.

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment holding this cluster's secrets and vars
        required: true
        type: string
      values:
        description: Helm values file for this cluster
        required: true
        type: string

permissions: read-all

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write # required for the OIDC token exchange
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Pinned so a new Helm major can't change flag behaviour under us.
      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.0

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      # Namespace and secret store come from iac-ng, hence no --create-namespace.
      # Long timeout: the app ignores SIGTERM and readiness waits on Blockbook and the RSK node.
      - name: Helm upgrade
        run: |
          helm upgrade --install 2wp-api ./helm \
            --namespace 2wp-api \
            -f "$VALUES_FILE" \
            --set image.registry="$ECR_REGISTRY" \
            --set api.image.repository="$ECR_REPOSITORY" \
            --set api.image.tag="$IMAGE_TAG" \
            --set daemon.image.repository="$ECR_REPOSITORY" \
            --set daemon.image.tag="$IMAGE_TAG" \
            --rollback-on-failure --wait --timeout 10m
        env:
          VALUES_FILE: ${{ inputs.values }}
