name: 2wp-api build

on: [push, pull_request]

permissions: read-all

jobs:
  checkout-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0

      - name: Setup NodeJS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Generate .env file
        run: |
          cp .env.test .env

      - name: Build & test project
        run: |
          npm ci
          npm run test:all
          npm run eslint
          npm run only-coverage

  integration-tests:
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3
        ports: ['4566:4566']
        env:
          SERVICES: sqs
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup NodeJS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Generate .env file
        run: |
          cp .env.test .env

      - name: Install dependencies
        run: npm ci

      # Service containers do not run LocalStack's init/ready.d hooks, so the
      # queue is created explicitly instead of reusing ci/localstack-init.
      - name: Create SQS queue
        run: node ci/create-atlas-queue.js
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          ATLAS_SQS_ENDPOINT: http://localhost:4566

      - name: Run integration tests
        run: npm run integration-test
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          ATLAS_SQS_ENDPOINT: http://localhost:4566
